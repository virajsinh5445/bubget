<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Tracker System</title>
    <link rel="stylesheet" href="bud.css" />
  </head>
  <body>
    
    <h1>Budget Tracker System</h1>
    <div class="container">
      <div class="sidebar">
        <div class="card">
          <h3>Add Budget</h3>
          <label>Budget</label>
          <input type="number" id="budgetInput" />
          <button class="blue-btn" onclick="addBudget()">Add Budget</button>
        </div>

        <div class="card expense-card">
          <h3>Add Expense</h3>
          <label>Expense Title:</label>
          <input type="text" id="expenseTitle" />
          <label>Amount:</label>
          <input type="number" id="expenseAmount" />
          <button class="blue-btn" onclick="addExpense()">Add Expense</button>
        </div>

        <button class="reset-btn" onclick="resetAll()">Reset All</button>
      </div>

      <div class="main">
        <div class="summary">
          <div>Total Budget: <span id="totalBudget">1000.00</span></div>
          <div>Total Expenses: <span id="totalExpenses">750.00</span></div>
          <div>Budget Left: <span id="budgetLeft">250.00</span></div>
        </div>

        <h3 class="history-title">Expense History:</h3>
        <div class="table-header">
          <span>Expense Name</span>
          <span>Amount</span>
          <span>Action</span>
        </div>

        <div id="expenseList"></div>
      </div>
    </div>

    <script src="bud.js"></script>
  </body>
</html>
